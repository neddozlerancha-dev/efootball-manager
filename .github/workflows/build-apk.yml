name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create web app
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>eFootball Tournament Hub</title>
            <style>
              html,body {
                margin:0;
                width:100%;
                height:100%;
                overflow:hidden;
              }
              iframe {
                width:100%;
                height:100%;
                border:0;
              }
            </style>
          </head>
          <body>
            <iframe src="https://fascinating-meerkat-bf0a84.netlify.app"></iframe>
          </body>
          </html>
          EOF

      - name: Initialize Capacitor
        run: |
          npx cap init "eFootball Tournament Hub" "com.efootball.tournamenthub" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eFootball-Tournament-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
