<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><title>Reset password • eFootball Tournament Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0%,#12391e 0,#090909 38%,#030303 100%);color:#f5f5f5;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#101010;border:1px solid #1d5530;border-radius:18px;padding:24px;box-shadow:0 16px 50px #0009}h1{margin-top:0}.muted{color:#aaa}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid #4d4d4d;background:#080808;color:#fff;margin:8px 0}button{padding:12px 15px;border:0;border-radius:10px;background:#48ff42;color:#080808;font-weight:900;cursor:pointer;margin-top:8px;width:100%}a{color:#e0bb35}.status{margin-top:12px;min-height:22px}
</style></head><body><div class="card"><h1>Reset your password</h1><p class="muted">Choose a new password for your eFootball Tournament Hub account.</p><input id="password" type="password" autocomplete="new-password" placeholder="New password (8+ characters)"><input id="confirm" type="password" autocomplete="new-password" placeholder="Confirm new password"><button id="btn" onclick="updatePassword()">Set new password</button><p id="msg" class="muted status">Checking reset link…</p><a href="/">Back to login</a></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const supabase=createClient('https://nasalxetgrkitnqivzhv.supabase.co','sb_publishable_R3-jGXnZ9z13gqZPkiFFhw_ZZaHv5uo');
const msg=document.getElementById('msg'); const btn=document.getElementById('btn');
let ready=false;
function setMsg(t){msg.textContent=t}
supabase.auth.onAuthStateChange((event, session)=>{
  if(event==='PASSWORD_RECOVERY' || session){ready=true;setMsg('Reset link verified. Enter your new password.');btn.disabled=false;}
});
const {data:{session}}=await supabase.auth.getSession();
if(session){ready=true;setMsg('Reset link verified. Enter your new password.');}
else if(!location.hash && !location.search){setMsg('Open the password-reset link from your email to continue.');}
else{setMsg('Verifying reset link…');}
window.updatePassword=async()=>{
 const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(!ready)return setMsg('This reset link is missing or expired. Request a new one from the login page.');
 if(p.length<8)return setMsg('Password must be at least 8 characters.');
 if(p!==c)return setMsg('Passwords do not match.');
 btn.disabled=true;setMsg('Updating password…');
 const {error}=await supabase.auth.updateUser({password:p});
 if(error){btn.disabled=false;return setMsg(error.message);}
 setMsg('Password updated successfully. Returning to login…');
 setTimeout(async()=>{await supabase.auth.signOut();location.href='/';},1200);
};
</script></body></html>
