name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "eFootball Tournament Hub" "com.efootball.tournamenthub" --web-dir=www
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=https://fascinating-meerkat-bf0a84.netlify.app">
            <title>eFootball Tournament Hub</title>
          </head>
          <body>
            Opening eFootball Tournament Hub...
          </body>
          </html>
          EOF
          npx cap add android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eFootball-Tournament-Hub-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
